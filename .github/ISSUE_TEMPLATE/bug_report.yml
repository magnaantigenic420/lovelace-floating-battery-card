name: Bug report
description: Report a reproducible Floating Battery Card problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: Remove private/internal details before posting.
      render: yaml
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Floating Battery Card version
    validations:
      required: true
  - type: textarea
    id: browser
    attributes:
      label: Browser/device and logs
      description: Include relevant browser console errors if available.
