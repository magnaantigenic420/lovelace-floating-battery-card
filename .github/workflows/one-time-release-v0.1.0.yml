name: One-time v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-release-v0.1.0.yml"

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove helper and create v0.1.0 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/one-time-release-v0.1.0.yml
          git add .github/workflows/one-time-release-v0.1.0.yml
          git commit -m "Remove one-time v0.1.0 release helper"
          release_sha="$(git rev-parse HEAD)"

          git push origin HEAD:main
          git tag -a v0.1.0 "$release_sha" -m "Floating Battery Card v0.1.0"
          git push origin v0.1.0
