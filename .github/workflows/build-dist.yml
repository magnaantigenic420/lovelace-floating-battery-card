name: Build dist

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit generated artifact and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/floating-battery-card.js package-lock.json
          if git diff --cached --quiet; then
            echo "dist and package-lock are already current"
            exit 0
          fi
          git commit -m "Build distribution artifact"
          git push
