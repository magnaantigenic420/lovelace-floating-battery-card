<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Floating Battery Card illustrated preview</title>
  <desc id="desc">A Home Assistant style dashboard with a single floating circular battery card in the bottom right corner, matching the default card layout.</desc>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#101418"/>
  <rect x="34" y="34" width="1132" height="82" rx="18" fill="#1d252c"/>
  <text x="70" y="86" fill="#f3f5f7" font-family="Arial, sans-serif" font-size="32" font-weight="700">Kitchen</text>
  <rect x="34" y="142" width="550" height="220" rx="18" fill="#1d252c"/>
  <rect x="610" y="142" width="556" height="220" rx="18" fill="#1d252c"/>
  <rect x="34" y="388" width="760" height="253" rx="18" fill="#1d252c"/>
  <text x="64" y="187" fill="#98a6b3" font-family="Arial, sans-serif" font-size="20">Dashboard content</text>

  <g filter="url(#shadow)">
    <circle cx="1052" cy="525" r="96" fill="#3f4853"/>

    <!-- Same vertical silhouette as the default mdi:battery icon used by the card. -->
    <path d="M16 20H8V6H10V4H14V6H16V20Z"
          fill="#4caf50"
          transform="translate(998 425) scale(4.5)"/>

    <text x="1052" y="587"
          text-anchor="middle"
          fill="#4caf50"
          font-family="Arial, sans-serif"
          font-size="44"
          font-weight="700">100%</text>
  </g>

  <text x="64" y="625" fill="#748390" font-family="Arial, sans-serif" font-size="17">Illustrated preview · viewport-fixed · configurable thresholds, icons and colors</text>
</svg>
